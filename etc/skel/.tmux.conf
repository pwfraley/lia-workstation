# =============================================================================
# tmux Konfiguration
# =============================================================================

# -----------------------------------------------------------------------------
# Allgemein
# -----------------------------------------------------------------------------

# Prefix: Ctrl+a (statt Ctrl+b - angenehmer zu tippen)
#unbind C-b
#set -g prefix C-a
#bind C-a send-prefix

# Konfiguration neu laden
bind r source-file ~/.tmux.conf \; display "Konfiguration neu geladen"

# Index bei 1 starten (nicht 0) - logischer auf der Tastatur
set -g base-index 1
setw -g pane-base-index 1

# Fensternummern nach Schließen neu vergeben
set -g renumber-windows on

# Längeren Verlauf
set -g history-limit 10000

# Keine Verzögerung bei Escape-Taste (wichtig für vim/neovim)
set -sg escape-time 0

# Fokus-Events weitergeben (für vim autoread)
set -g focus-events on

# Terminal-Farben
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# -----------------------------------------------------------------------------
# Mouse
# -----------------------------------------------------------------------------

set -g mouse on

# -----------------------------------------------------------------------------
# Fenster & Panes
# -----------------------------------------------------------------------------

# Panes mit | und - aufteilen (intuitiver als % und ")
#bind | split-window -h -c "#{pane_current_path}"
#bind - split-window -v -c "#{pane_current_path}"
#unbind '"'
#unbind %

# Neues Fenster im aktuellen Verzeichnis
#bind c new-window -c "#{pane_current_path}"

# Pane-Navigation mit vim-Tasten (h/j/k/l)
#bind h select-pane -L
#bind j select-pane -D
#bind k select-pane -U
#bind l select-pane -R

# Pane-Größe ändern (wiederholbar mit Prefix gedrückt halten)
#bind -r H resize-pane -L 5
#bind -r J resize-pane -D 5
#bind -r K resize-pane -U 5
#bind -r L resize-pane -R 5

# Panes gleichmäßig verteilen
#bind = select-layout even-horizontal
#bind + select-layout even-vertical

# Zwischen letzten zwei Fenstern wechseln
#bind Tab last-window

# -----------------------------------------------------------------------------
# Copy-Mode (vi-Stil)
# -----------------------------------------------------------------------------

#setw -g mode-keys vi

#bind Enter copy-mode
#bind -T copy-mode-vi v send -X begin-selection
#bind -T copy-mode-vi y send -X copy-selection-and-cancel
#bind -T copy-mode-vi Escape send -X cancel

# Mit Maus kopieren
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# -----------------------------------------------------------------------------
# Statusleiste
# -----------------------------------------------------------------------------

set -g status on
set -g status-interval 5
set -g status-position bottom

# Farben
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g window-status-style "bg=#313244,fg=#cdd6f4"
set -g window-status-current-style "bg=#89b4fa,fg=#1e1e2e,bold"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#f38ba8,fg=#1e1e2e,bold"

# Linke Seite: Session-Name
set -g status-left-length 30
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] "

# Rechte Seite: Uhrzeit & Datum
set -g status-right-length 50
set -g status-right "#[fg=#a6e3a1] %H:%M #[fg=#cdd6f4]| #[fg=#cba6f7]%d.%m.%Y #[fg=#cdd6f4]| #[fg=#89b4fa]#H "

# Fenster-Status
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-separator ""

# Aktivitäts-Benachrichtigung
setw -g monitor-activity on
set -g visual-activity off
